server:
  port: ${SERVER_PORT:18080}

spring:
  datasource:
    url: jdbc:h2:mem:librio-e2e;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  sql:
    init:
      mode: never

librio:
  circulation:
    expiration-scan-interval: 1h
