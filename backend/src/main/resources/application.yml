server:
  port: 8080
  forward-headers-strategy: framework

librio:
  cors:
    allowed-origin-patterns: ${LIBRIO_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  circulation:
    commitment-limit: ${LIBRIO_COMMITMENT_LIMIT:3}
    request-expiration: ${LIBRIO_REQUEST_EXPIRATION:1d}
    pickup-expiration: ${LIBRIO_PICKUP_EXPIRATION:3d}
    loan-period: ${LIBRIO_LOAN_PERIOD:14d}
    expiration-scan-interval: ${LIBRIO_EXPIRATION_SCAN_INTERVAL:60s}

spring:
  application:
    name: librio-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/librio}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

---
# Active when spring.profiles.active=test or H2 fallback is explicitly enabled
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:libriodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
  sql:
    init:
      schema-locations: optional:classpath:/schema-h2-not-used.sql
      data-locations: classpath:data.sql
  h2:
    console:
      enabled: true
      path: /h2-console
